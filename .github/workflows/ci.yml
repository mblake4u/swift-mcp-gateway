name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Verify requirements files are in sync with their .in sources
        run: |
          pip-compile --generate-hashes --output-file requirements.check.txt requirements.in
          pip-compile --generate-hashes --output-file requirements-dev.check.txt requirements-dev.in
          # Header line embeds the output filename and always differs by design.
          diff -I 'pip-compile.*--output-file' requirements.txt requirements.check.txt || \
            (echo "requirements.txt is out of sync — run pip-compile --generate-hashes" && exit 1)
          diff -I 'pip-compile.*--output-file' requirements-dev.txt requirements-dev.check.txt || \
            (echo "requirements-dev.txt is out of sync — run pip-compile --generate-hashes" && exit 1)

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: pip-audit (supply chain check)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run smoke tests
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t swift-mcp-gateway:ci .
